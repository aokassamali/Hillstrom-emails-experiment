project:
  name: Hillstrom Email Marketing Experiment

data:
  raw_dir: data/raw
  processed_path: data/processed/hillstrom_clean.csv
  input_csv: C:\Users\aokas\Downloads\emaildataset\Kevin_Hillstrom_MineThatData_E-MailAnalytics_DataMiningChallenge_2008.03.20.csv
  id_col: customer_id
  arm_col: segment
  arm_map:
    control:
      - no e-mail
      - no email
      - No E-Mail
      - No Email
    mens:
      - mens e-mail
      - mens email
      - Mens E-Mail
      - Mens Email
    womens:
      - womens e-mail
      - womens email
      - Womens E-Mail
      - Womens Email
  visit_col: visit
  conversion_col: conversion
  spend_col: spend
  balance_covariates:
    - recency
    - history
    - history_segment
    - mens
    - womens
    - zip_code
    - newbie
    - channel
  adjustment_covariates:
    - recency
    - history
    - newbie
    - mens
    - womens
    - channel
    - zip_code
  duplicate_policy: drop_all  # drop_all or keep_first

srm:
  expected_allocation:
    control: 0.3333333333
    mens: 0.3333333333
    womens: 0.3333333333
  practical_delta_pp: 2.0  # TODO: confirm practical SRM deviation threshold

profit:
  margin: 0.40
  email_cost: 0.01

mes:
  min_effect: 0.05

bootstrap:
  iterations: 10000
  seed: 20240101

guardrails:
  visit_delta_pp: -0.2
  conversion_delta_pp: -0.1
