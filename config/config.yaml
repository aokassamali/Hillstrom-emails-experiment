project:
  name: Hillstrom Email Marketing Experiment

data:
  input_csv: C:\Users\aokas\Downloads\emaildataset
  id_col: customer_id
  arm_col: segment
  arm_map:
    control:
      - control
      - no e-mail
      - no email
      - no e-mail
      - no email
    mens:
      - mens
      - mens e-mail
      - mens email
    womens:
      - womens
      - womens e-mail
      - womens email
  visit_col: visit
  conversion_col: conversion
  spend_col: spend
  balance_covariates:
